# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gittok
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BAIDU_TRANSLATE_APPID
        sync: false
      - key: BAIDU_TRANSLATE_API_KEY
        sync: false
      - key: USE_MOCK_FEED
        value: "false"
      - key: NEXT_PUBLIC_USE_MOCK_FEED
        value: "false"
